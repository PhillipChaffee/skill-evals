# Deploys the static site in site/ to GitHub Pages. The site has no build
# step: the folder is uploaded as it is. Pages must be switched on once in the
# repository settings, with "GitHub Actions" as the source, or the deploy job
# fails.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read  # least privilege by default; the job asks for more

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # bounds a hung deployment; GitHub's default is 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and a later push never cancels one in flight:
    # a cancelled deployment can leave the site half published.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read  # checks out site/
      pages: write  # publishes the uploaded artifact as the site
      id-token: write  # proves to Pages that the artifact comes from this workflow run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
